name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -S warning worklog.30m.sh install.sh tests/unit.sh tests/e2e.sh

  unit:
    # The plugin targets macOS (BSD date, SwiftBar), so the tests run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/unit.sh
